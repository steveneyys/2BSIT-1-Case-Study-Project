<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales - Hope, Inc. ERP</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="app-top">
    <a class="brand" href="/home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>hope.</a>
    <div id="who" class="who"></div>
    <button id="logout" class="link-btn" type="button">Sign out &#8599;</button>
  </header>
  <nav class="tabs" id="tabs" aria-label="Main menu"></nav>
  <main class="page">
    <h1>Sales</h1>
    <div style="height:1rem"></div>
    <form class="toolbar" id="filters" role="search" novalidate>
      <input type="search" id="search" placeholder="Search by transaction, customer or salesperson" aria-label="Search sales" maxlength="100" />
      <button class="btn" type="button" id="clear" hidden>Clear search</button>
      <button class="btn primary" type="button" id="add-btn" hidden>+ New Sale</button>
    </form>
    <div class="status-tabs" id="status-tabs" role="group" aria-label="Filter by status" hidden></div>
    <div id="msg" role="status" aria-live="polite"></div>
    <div class="table-wrap sales">
      <table>
        <caption class="visually-hidden">Sales</caption>
        <thead>
          <tr>
            <th scope="col" aria-sort="descending"><button type="button" class="sort" data-sort="transno">Transaction No.</button></th>
            <th scope="col" aria-sort="none"><button type="button" class="sort" data-sort="date">Sales date</button></th>
            <th scope="col" aria-sort="none"><button type="button" class="sort" data-sort="customer">Customer</button></th>
            <th scope="col" aria-sort="none"><button type="button" class="sort" data-sort="employee">Salesperson</button></th>
            <th scope="col" class="num">Total</th>
            <th scope="col" id="status-th" hidden>Status</th>
            <th scope="col" id="stamp-th" hidden>Stamp</th>
            <th scope="col" id="actions-th" hidden>Actions</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="5" class="muted">Loading...</td></tr></tbody>
      </table>
    </div>
    <div class="pager" id="pager">
      <span id="count" class="muted" aria-live="polite"></span>
      <span class="pager-btns">
        <label class="visually-hidden" for="pageSize">Rows per page</label>
        <select id="pageSize" style="width:auto">
          <option value="10">10 per page</option><option value="25" selected>25 per page</option>
          <option value="50">50 per page</option><option value="100">100 per page</option>
        </select>
        <button class="btn" type="button" id="prev">Previous</button>
        <span id="pageinfo" class="muted"></span>
        <button class="btn" type="button" id="next">Next</button>
      </span>
    </div>
  </main>
  <dialog id="sale-dialog" aria-labelledby="sale-title">
    <form id="sale-form" method="dialog" novalidate>
      <div class="head"><h2 id="sale-title">New Sale</h2><button type="button" class="close" id="sale-close" aria-label="Close">&times;</button></div>
      <hr />
      <label for="transno">Transaction number</label>
      <input id="transno" name="transno" readonly aria-describedby="transno-hint" />
      <div class="hint" id="transno-hint">Assigned on save. It cannot be changed.</div>
      <label for="salesdate">Sales date <span class="req">(required)</span></label>
      <input id="salesdate" name="salesdate" type="date" required aria-describedby="salesdate-hint" />
      <div class="hint" id="salesdate-hint">Line prices follow this date. It cannot be in the future.</div>
      <div class="err" data-for="salesdate"></div>
      <label for="custno">Customer <span class="req">(required)</span></label>
      <select id="custno" name="custno" required><option value="">Choose...</option></select>
      <div class="err" data-for="custno"></div>
      <label for="empno">Salesperson <span class="req">(required)</span></label>
      <select id="empno" name="empno" required><option value="">Choose...</option></select>
      <div class="err" data-for="empno"></div>
      <div class="err" id="form-error" role="alert"></div>
      <div class="buttons">
        <button class="btn" type="button" id="cancel-btn">Cancel</button>
        <button class="btn primary" type="submit" id="save-btn">Save Sale</button>
      </div>
    </form>
  </dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-text">
    <form method="dialog" id="confirm-form">
      <div class="head"><h2 id="confirm-title">Change the sales date?</h2></div>
      <p id="confirm-text" class="muted"></p>
      <div class="buttons">
        <button class="btn" type="button" id="confirm-cancel">Cancel</button>
        <button class="btn primary" type="submit" id="confirm-ok">Change date</button>
      </div>
    </form>
  </dialog>
  <script src="/js/shell.js"></script>
  <script src="/js/sales.js"></script>
</body>
</html>
