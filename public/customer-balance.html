<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Balance - Hope, Inc. ERP</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="app-top">
    <a class="brand" href="/home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>hope.</a>
    <div id="who" class="who"></div>
    <button id="logout" class="link-btn" type="button">Sign out &#8599;</button>
  </header>
  <nav class="tabs" id="tabs" aria-label="Main menu"></nav>
  <main class="page">
    <nav class="subnav" id="sales-nav" aria-label="Sales" hidden></nav>
    <p><a href="/payments.html">&larr; Back to Payments</a></p>
    <h1 id="title">Customer balance</h1>
    <div id="msg" role="status" aria-live="polite"></div>
    <section id="card" class="balance-card" hidden>
      <h2 id="heading"></h2>
      <div class="table-wrap">
        <table>
          <caption class="visually-hidden">Sales of this customer</caption>
          <thead><tr>
            <th scope="col">Transaction No.</th><th scope="col">Sales date</th>
            <th scope="col" class="num">Sale total</th><th scope="col" class="num">Paid</th><th scope="col" class="num">Balance</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="balance-sum" id="sum"></p>
      <p id="standing" class="badge"></p>
      <p class="muted" id="note" hidden></p>
    </section>
  </main>
  <script src="/js/shell.js"></script>
  <script src="/js/sales-nav.js"></script>
  <script src="/js/customer-balance.js"></script>
</body>
</html>
