<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report - Hope, Inc. ERP</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="app-top">
    <a class="brand" href="/home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>hope.</a>
    <div id="who" class="who"></div>
    <button id="logout" class="link-btn" type="button">Sign out &#8599;</button>
  </header>
  <nav class="tabs" id="tabs" aria-label="Main menu"></nav>
  <main class="page">
    <p class="no-print"><a href="/reports.html">&larr; Back to Reports</a></p>
    <h1 id="title">Report</h1>
    <div class="toolbar no-print">
      <button class="btn" type="button" id="print-btn" hidden>Print</button>
      <button class="btn" type="button" id="pdf-btn" hidden>Save as PDF</button>
    </div>
    <p class="hint no-print" id="pdf-hint" hidden>In the print window, choose &ldquo;Save as PDF&rdquo; as the destination.</p>
    <form class="report-filters no-print" id="filters" hidden novalidate>
      <label for="empno">Employee</label>
      <select id="empno" name="empno"><option value="">Choose an employee...</option></select>
    </form>
    <form class="report-filters no-print" id="range-form" hidden novalidate>
      <div><label for="from">From date</label><input id="from" name="from" type="date" required /><div class="err" data-for="from"></div></div>
      <div><label for="to">To date</label><input id="to" name="to" type="date" required /><div class="err" data-for="to"></div></div>
      <div><label for="topn">Top N</label><input id="topn" name="topn" type="number" min="1" max="100" step="1" inputmode="numeric" required /><div class="err" data-for="topn"></div></div>
      <button class="btn primary" type="submit" id="generate-btn">Generate Report</button>
    </form>
    <div id="msg" role="status" aria-live="polite"></div>
    <section id="output" hidden>
      <p class="muted" id="subtitle"></p>
      <div class="table-wrap report">
        <table>
          <caption class="visually-hidden" id="caption">Report</caption>
          <thead><tr id="head"></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="report-total" id="total" hidden></p>
      <p class="muted" id="note" hidden></p>
      <p class="muted" id="footer"></p>
    </section>
  </main>
  <script src="/js/shell.js"></script>
  <script src="/js/report.js"></script>
</body>
</html>
