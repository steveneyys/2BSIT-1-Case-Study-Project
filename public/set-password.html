<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set password - Hope, Inc. ERP</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="auth">
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="auth-top">
    <a class="brand" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>hope.</a>
    <nav aria-label="Account">
      <a href="/">Back to home</a>
      <a class="strong" href="/login.html">Sign in</a>
      <a class="btn" href="/register.html">Register &#8599;</a>
    </nav>
  </header>
  <main class="auth-main">
    <div class="auth-card">
      <div class="eyebrow">Account access</div>
      <h1>Set your password</h1>
      <p class="sub">Choose a password to finish setting up your account.</p>
      <div id="banner" class="banner" role="status" aria-live="polite"></div>
      <form id="set-form" novalidate>
      <label for="password">Password</label>
      <div class="pw"><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required /><button type="button" class="pw-toggle" data-target="password" aria-label="Show password">Show</button></div>
      <div class="err" data-for="password"></div>
      <label for="confirmPassword">Confirm password</label>
      <div class="pw"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required /><button type="button" class="pw-toggle" data-target="confirmPassword" aria-label="Show confirm password">Show</button></div>
      <div class="err" data-for="confirmPassword"></div>
      <button type="submit" id="submit" class="btn primary block">Set password &#8599;</button>
      </form>
      <p class="foot"><a href="/login.html">Back to sign in</a></p>
    </div>
  </main>
  <footer class="auth-foot"><span>Hope, Inc. ERP &middot; Business, brought together.</span><span>Approved accounts. Assigned access.</span></footer>
  <script src="/js/ui.js"></script>
  <script src="/js/set-password.js"></script>
</body>
</html>
