<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set password - Hope, Inc. ERP</title>
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <main class="card">
    <h1>Set your password</h1>
    <p class="sub">Choose a password to finish setting up your account.</p>
    <form id="set-form" novalidate>
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
      <div class="err" data-for="password"></div>
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required />
      <div class="err" data-for="confirmPassword"></div>
      <button type="submit" id="submit">Save password</button>
      <div id="banner" class="banner" role="status" aria-live="polite"></div>
    </form>
    <p class="foot"><a href="/login.html">Back to sign in</a></p>
  </main>
  <script src="/js/set-password.js"></script>
</body>
</html>
