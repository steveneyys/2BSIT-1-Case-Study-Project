<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit Viewer - Hope, Inc. ERP</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="app-top">
    <a class="brand" href="/home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>hope.</a>
    <div id="who" class="who"></div>
    <button id="logout" class="link-btn" type="button">Sign out &#8599;</button>
  </header>
  <nav class="tabs" id="tabs" aria-label="Main menu"></nav>
  <main class="page">
    <h1>Audit Viewer</h1>
    <p class="muted">Every add, edit, delete and restore, newest first. The audit trail is read-only. Times are Philippine time.</p>
    <form class="card audit-filters" id="filters" novalidate>
      <h2>Filters</h2>
      <div class="audit-grid">
        <div><label for="from">From Date</label><input id="from" name="from" type="date" /><div class="err" data-for="from"></div></div>
        <div><label for="to">To Date</label><input id="to" name="to" type="date" /><div class="err" data-for="to"></div></div>
        <div><label for="actor">Actor</label><select id="actor" name="actor"><option value="">All actors</option></select><div class="err" data-for="actor"></div></div>
        <div><label for="module">Module</label><select id="module" name="module"><option value="">All modules</option></select><div class="err" data-for="module"></div></div>
        <div><label for="action">Action</label><select id="action" name="action"><option value="">All actions</option></select><div class="err" data-for="action"></div></div>
        <div><label for="ref">Record reference</label><input id="ref" name="ref" type="search" maxlength="60" placeholder="e.g. TR000125" /><div class="err" data-for="ref"></div></div>
      </div>
      <div class="toolbar" style="margin:1rem 0 0">
        <button class="btn primary" type="submit" id="apply">Apply filters</button>
        <button class="btn" type="button" id="reset-btn">Reset</button>
      </div>
    </form>
    <div id="msg" role="status" aria-live="polite"></div>
    <div class="table-wrap audit">
      <table>
        <caption class="visually-hidden">Audit events</caption>
        <thead>
          <tr>
            <th scope="col">Timestamp</th><th scope="col">Actor</th><th scope="col">Module</th>
            <th scope="col">Action</th><th scope="col">Target</th><th scope="col">Details</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="6" class="muted">Loading...</td></tr></tbody>
      </table>
    </div>
    <div class="pager" id="pager">
      <span id="count" class="muted" aria-live="polite"></span>
      <span class="pager-btns">
        <label class="visually-hidden" for="pageSize">Rows per page</label>
        <select id="pageSize" style="width:auto">
          <option value="10">10 per page</option><option value="25" selected>25 per page</option>
          <option value="50">50 per page</option><option value="100">100 per page</option>
        </select>
        <button class="btn" type="button" id="prev">Previous</button>
        <span id="pageinfo" class="muted"></span>
        <button class="btn" type="button" id="next">Next</button>
      </span>
    </div>
  </main>
  <script src="/js/shell.js"></script>
  <script src="/js/audit.js"></script>
</body>
</html>
