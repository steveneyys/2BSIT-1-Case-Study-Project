<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password - Hope, Inc. ERP</title>
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <main class="card">
    <h1>Forgot password</h1>
    <p class="sub">Enter your email and we will send you a link to choose a new password.</p>
    <form id="forgot-form" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required />
      <button type="submit" id="submit">Send reset link</button>
      <div id="banner" class="banner" role="status" aria-live="polite"></div>
    </form>
    <p class="foot"><a href="/login.html">Back to sign in</a></p>
  </main>
  <script src="/js/forgot-password.js"></script>
</body>
</html>
