<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Departments - Hope, Inc. ERP</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="app-top">
    <a class="brand" href="/home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>hope.</a>
    <div id="who" class="who"></div>
    <button id="logout" class="link-btn" type="button">Sign out &#8599;</button>
  </header>
  <nav class="tabs" id="tabs" aria-label="Main menu"></nav>
  <main class="page">
    <h1>Departments</h1>
    <div style="height:1rem"></div>
    <form class="toolbar" id="filters" role="search" novalidate>
      <input type="search" id="search" placeholder="Search by code or name" aria-label="Search departments" maxlength="100" />
      <button class="btn" type="button" id="clear" hidden>Clear filters</button>
      <button class="btn primary" type="button" id="add-btn" hidden>Add Department</button>
    </form>
    <div class="status-tabs" id="status-tabs" role="group" aria-label="Filter by status" hidden></div>
    <div id="msg" role="status" aria-live="polite"></div>
    <div class="table-wrap departments">
      <table>
        <caption class="visually-hidden">Departments</caption>
        <thead>
          <tr>
            <th scope="col" aria-sort="ascending"><button type="button" class="sort" data-sort="code">Code</button></th>
            <th scope="col" aria-sort="none"><button type="button" class="sort" data-sort="name">Name</button></th>
            <th scope="col" id="status-th" hidden>Status</th>
            <th scope="col" id="stamp-th" hidden>Stamp</th>
            <th scope="col" id="actions-th" hidden>Actions</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="2" class="muted">Loading...</td></tr></tbody>
      </table>
    </div>
    <div class="pager" id="pager">
      <span id="count" class="muted" aria-live="polite"></span>
      <span class="pager-btns">
        <label class="visually-hidden" for="pageSize">Rows per page</label>
        <select id="pageSize" style="width:auto">
          <option value="10">10 per page</option><option value="25" selected>25 per page</option>
          <option value="50">50 per page</option><option value="100">100 per page</option>
        </select>
        <button class="btn" type="button" id="prev">Previous</button>
        <span id="pageinfo" class="muted"></span>
        <button class="btn" type="button" id="next">Next</button>
      </span>
    </div>
  </main>
  <dialog id="department-dialog" aria-labelledby="department-title">
    <form id="department-form" method="dialog" novalidate>
      <div class="head"><h2 id="department-title">Add Department</h2><button type="button" class="close" id="department-close" aria-label="Close">&times;</button></div>
      <hr />
      <label for="code">Department code <span class="req">(required)</span></label>
      <input id="code" name="code" maxlength="3" autocomplete="off" required aria-describedby="code-hint" style="text-transform:uppercase" />
      <div class="hint" id="code-hint">2 or 3 letters or digits, for example HRD. It cannot be changed later.</div>
      <div class="err" data-for="code"></div>
      <label for="name">Department name <span class="req">(required)</span></label>
      <input id="name" name="name" maxlength="20" required />
      <div class="err" data-for="name"></div>
      <div class="err" id="form-error" role="alert"></div>
      <div class="buttons">
        <button class="btn" type="button" id="cancel-btn">Cancel</button>
        <button class="btn primary" type="submit" id="save-btn">Save Department</button>
      </div>
    </form>
  </dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-text">
    <form method="dialog" id="confirm-form">
      <div class="head"><h2 id="confirm-title">Delete department?</h2></div>
      <p id="confirm-text" class="muted"></p>
      <div class="err" id="confirm-error" role="alert"></div>
      <div class="buttons">
        <button class="btn" type="button" id="confirm-cancel">Cancel</button>
        <button class="btn danger" type="submit" id="confirm-ok">Delete</button>
      </div>
    </form>
  </dialog>
  <script src="/js/shell.js"></script>
  <script src="/js/departments.js"></script>
</body>
</html>
