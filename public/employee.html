<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Profile - Hope, Inc. ERP</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="app-top">
    <a class="brand" href="/home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>hope.</a>
    <div id="who" class="who"></div>
    <button id="logout" class="link-btn" type="button">Sign out &#8599;</button>
  </header>
  <nav class="tabs" id="tabs" aria-label="Main menu"></nav>
  <main class="page">
    <nav class="subnav" id="hr-nav" aria-label="Human Resources" hidden></nav>
    <p><a href="/employees.html">&larr; Back to Employees</a></p>
    <h1 id="title">Employee Profile</h1>
    <div id="msg" role="status" aria-live="polite"></div>
    <section id="details" hidden aria-label="Details">
      <dl class="profile-grid" id="grid"></dl>
    </section>
    <section id="job-section" hidden aria-labelledby="job-heading">
      <h2 id="job-heading">Job timeline</h2>
      <p class="muted" id="current"></p>
      <ol class="timeline" id="timeline"></ol>
      <p><a class="btn" id="manage" href="#" hidden>Manage job history</a></p>
    </section>
    <section id="restricted" hidden aria-label="Job history">
      <h2>Job timeline</h2>
      <p class="muted">Job history and salary are hidden. You need the View Job History right to see them. Ask an administrator if you need access.</p>
    </section>
  </main>
  <script src="/js/shell.js"></script>
  <script src="/js/hr-nav.js"></script>
  <script src="/js/employee.js"></script>
</body>
</html>
