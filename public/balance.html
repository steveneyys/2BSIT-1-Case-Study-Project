<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaction Balance - Hope, Inc. ERP</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="app-top">
    <a class="brand" href="/home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>hope.</a>
    <div id="who" class="who"></div>
    <button id="logout" class="link-btn" type="button">Sign out &#8599;</button>
  </header>
  <nav class="tabs" id="tabs" aria-label="Main menu"></nav>
  <main class="page">
    <nav class="subnav" id="sales-nav" aria-label="Sales" hidden></nav>
    <p><a href="/payments.html">&larr; Back to Payments</a></p>
    <h1 id="title">Transaction balance</h1>
    <div id="msg" role="status" aria-live="polite"></div>
    <section id="card" class="balance-card" hidden>
      <h2 id="heading"></h2>
      <p class="muted" id="meta"></p>
      <dl class="balance-figures">
        <div><dt>Sale total</dt><dd id="total"></dd></div>
        <div><dt>Paid</dt><dd id="paid"></dd></div>
        <div><dt>Balance</dt><dd id="balance"></dd></div>
      </dl>
      <p id="standing" class="badge"></p>
      <p class="muted" id="note" hidden></p>
      <div class="table-wrap">
        <table>
          <caption class="visually-hidden">Payments of this sale</caption>
          <thead><tr><th scope="col">Receipt No.</th><th scope="col">Payment date</th><th scope="col" class="num">Payment amount</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="hint" id="inactive" hidden></p>
      <p><a id="customer-link" href="#">View customer balance</a> &middot; <a id="sale-link" href="#">Sale details</a></p>
    </section>
  </main>
  <script src="/js/shell.js"></script>
  <script src="/js/sales-nav.js"></script>
  <script src="/js/balance.js"></script>
</body>
</html>
