<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in - Hope, Inc. ERP</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="auth">
  <header class="auth-top">
    <a class="brand" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>hope.</a>
    <nav aria-label="Account">
      <a href="/">Back to home</a>
      <a class="strong" href="/login.html">Sign in</a>
      <a class="btn" href="/register.html">Register &#8599;</a>
    </nav>
  </header>
  <main class="auth-main">
    <div class="auth-card">
      <div class="eyebrow">Welcome back</div>
      <h1>Sign in to your workspace.</h1>
      <p class="sub">Use your Hope, Inc. ERP account to continue.</p>
      <div id="banner" class="banner" role="alert" aria-live="polite"></div>
      <form id="login-form" novalidate>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username" required />
      <label for="password">Password</label>
      <div class="pw"><input id="password" name="password" type="password" autocomplete="current-password" required /><button type="button" class="pw-toggle" data-target="password" aria-label="Show password">Show</button></div>
      <div class="aux"><a href="/forgot-password.html">Forgot password?</a></div>
      <button type="submit" id="submit" class="btn primary block">Sign in &#8599;</button>
      </form>
      <p class="foot">Don&rsquo;t have an account? <a href="/register.html">Register</a></p>
    </div>
  </main>
  <footer class="auth-foot"><span>Hope, Inc. ERP &middot; Business, brought together.</span><span>Approved accounts. Assigned access.</span></footer>
  <script src="/js/ui.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
