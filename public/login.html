<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in - Hope, Inc. ERP</title>
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <main class="card">
    <h1>Sign in</h1>
    <p class="sub">Welcome back to Hope, Inc. ERP.</p>
    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit" id="submit">Sign in</button>
      <div id="banner" class="banner" role="alert" aria-live="polite"></div>
    </form>
    <p class="foot"><a href="/forgot-password.html">Forgot password?</a> &middot; <a href="/register.html">Register</a></p>
  </main>
  <script src="/js/login.js"></script>
</body>
</html>
