<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employees - Hope, Inc. ERP</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="app-top">
    <a class="brand" href="/home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>hope.</a>
    <div id="who" class="who"></div>
    <button id="logout" class="link-btn" type="button">Sign out &#8599;</button>
  </header>
  <nav class="tabs" id="tabs" aria-label="Main menu"></nav>
  <main class="page">
    <nav class="subnav" id="hr-nav" aria-label="Human Resources" hidden></nav>
    <h1>Employees</h1>
    <div style="height:1rem"></div>
    <form class="toolbar" id="filters" role="search" novalidate>
      <input type="search" id="search" placeholder="Search by employee number or name" aria-label="Search employees" maxlength="100" />
      <label class="visually-hidden" for="gender">Gender</label>
      <select id="gender" style="width:auto">
        <option value="">All genders</option><option value="M">Male</option><option value="F">Female</option>
      </select>
      <label class="visually-hidden" for="employment">Employment</label>
      <select id="employment" style="width:auto">
        <option value="">All employment</option><option value="employed">Employed</option><option value="separated">Separated</option>
      </select>
      <button class="btn" type="button" id="clear" hidden>Clear filters</button>
      <button class="btn primary" type="button" id="add-btn" hidden>+ Add Employee</button>
    </form>
    <div class="status-tabs" id="status-tabs" role="group" aria-label="Filter by status" hidden></div>
    <div id="msg" role="status" aria-live="polite"></div>
    <div class="table-wrap employees">
      <table>
        <caption class="visually-hidden">Employees</caption>
        <thead>
          <tr>
            <th scope="col" aria-sort="ascending"><button type="button" class="sort" data-sort="empno">Employee No.</button></th>
            <th scope="col" aria-sort="none"><button type="button" class="sort" data-sort="name">Name</button></th>
            <th scope="col" aria-sort="none"><button type="button" class="sort" data-sort="gender">Gender</button></th>
            <th scope="col">Birth date</th>
            <th scope="col" aria-sort="none"><button type="button" class="sort" data-sort="hired">Hire date</button></th>
            <th scope="col" aria-sort="none"><button type="button" class="sort" data-sort="separated">Separation date</button></th>
            <th scope="col" id="status-th" hidden>Status</th>
            <th scope="col" id="stamp-th" hidden>Stamp</th>
            <th scope="col" id="actions-th" hidden>Actions</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="6" class="muted">Loading...</td></tr></tbody>
      </table>
    </div>
    <div class="pager" id="pager">
      <span id="count" class="muted" aria-live="polite"></span>
      <span class="pager-btns">
        <label class="visually-hidden" for="pageSize">Rows per page</label>
        <select id="pageSize" style="width:auto">
          <option value="10">10 per page</option><option value="25" selected>25 per page</option>
          <option value="50">50 per page</option><option value="100">100 per page</option>
        </select>
        <button class="btn" type="button" id="prev">Previous</button>
        <span id="pageinfo" class="muted"></span>
        <button class="btn" type="button" id="next">Next</button>
      </span>
    </div>
  </main>
  <script src="/js/shell.js"></script>
  <script src="/js/hr-nav.js"></script>
  <script src="/js/employees.js"></script>
</body>
</html>
