<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hope, Inc. ERP</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <style>
    .hero { max-width: 880px; padding: 4rem 0 2rem; }
    .hero h1 { font-size: clamp(2.4rem, 7vw, 3.75rem); font-weight: 700; letter-spacing: -.03em; line-height: 1.08; }
    .hero p { font-size: 1.05rem; color: var(--muted); margin: 1.25rem 0 2rem; max-width: 36rem; }
    .hero .cta { display: flex; gap: .75rem; flex-wrap: wrap; }
    .landing { flex: 1; padding: 0 clamp(1rem, 5vw, 4rem); }

    body.auth { position: relative; overflow-x: hidden; }
    .sky { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .auth-top, .landing, .auth-foot { position: relative; z-index: 1; }
    .cloud { overflow: visible; position: absolute; left: 0; width: var(--w); height: auto; fill: rgb(7 76 224 / .07); stroke: rgb(7 76 224 / .14); stroke-width: 1;
      animation: drift var(--d) linear infinite, bob var(--b) ease-in-out infinite; animation-delay: var(--delay, 0s), 0s; }
    .cloud.one   { --w: 340px; --d: 70s; --b: 7s;  top: 14%; --delay: -20s; }
    .cloud.two   { --w: 220px; --d: 95s; --b: 9s;  top: 52%; --delay: -60s; opacity: .8; }
    .cloud.three { --w: 280px; --d: 80s; --b: 8s;  top: 72%; --delay: -35s; opacity: .65; }
    @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(110vw); } }
    @keyframes bob { 0%, 100% { margin-top: 0; } 50% { margin-top: -18px; } }
    @media (prefers-reduced-motion: reduce) { .cloud { animation: none; left: 55%; } .cloud.two { left: 8%; } .cloud.three { left: 70%; } }
  </style>
</head>
<body class="auth">
  <div class="sky" aria-hidden="true">
    <svg class="cloud one" viewBox="0 -30 200 130" aria-hidden="true"><path d="M50 90a30 30 0 0 1-2-60 42 42 0 0 1 80-8 34 34 0 0 1 26 56 24 24 0 0 1-4 12z"/></svg>
    <svg class="cloud two" viewBox="0 -30 200 130" aria-hidden="true"><path d="M50 90a30 30 0 0 1-2-60 42 42 0 0 1 80-8 34 34 0 0 1 26 56 24 24 0 0 1-4 12z"/></svg>
    <svg class="cloud three" viewBox="0 -30 200 130" aria-hidden="true"><path d="M50 90a30 30 0 0 1-2-60 42 42 0 0 1 80-8 34 34 0 0 1 26 56 24 24 0 0 1-4 12z"/></svg>
  </div>
  <header class="auth-top">
    <a class="brand" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="width:22px;height:22px"><rect x="3" y="3" width="18" height="18"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>hope.</a>
    <nav aria-label="Account">
      <a class="strong" href="/login.html">Sign in</a>
      <a class="btn" href="/register.html">Register &#8599;</a>
    </nav>
  </header>
  <main class="landing">
    <section class="hero">
      <div class="eyebrow">Hope, Inc. ERP</div>
      <h1>Good work starts with a little more clarity.</h1>
      <p>Your business records and day-to-day operations, together in one organized workspace.</p>
      <div class="cta">
        <a class="btn primary" href="/login.html">Sign in &#8599;</a>
        <a class="btn" href="/register.html">Register</a>
      </div>
    </section>
  </main>
  <footer class="auth-foot"><span>Hope, Inc. ERP &middot; Business, brought together.</span><span>Approved accounts. Assigned access.</span></footer>
</body>
</html>
