<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products - Hope, Inc. ERP</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="app-top">
    <a class="brand" href="/home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>hope.</a>
    <div id="who" class="who"></div>
    <button id="logout" class="link-btn" type="button">Sign out &#8599;</button>
  </header>
  <nav class="tabs" id="tabs" aria-label="Main menu"></nav>
  <main class="page">
    <h1>Products</h1>
    <div style="height:1rem"></div>
    <form class="toolbar" id="filters" role="search" novalidate>
      <input type="search" id="search" placeholder="Search by code or description" aria-label="Search products" maxlength="100" />
      <label class="visually-hidden" for="unit">Unit</label>
      <select id="unit" style="max-width:220px">
        <option value="">All units</option>
        <option value="pc">pc (piece)</option>
        <option value="ea">ea (each)</option>
        <option value="mtr">mtr (meter)</option>
        <option value="pkg">pkg (package)</option>
        <option value="ltr">ltr (liter)</option>
      </select>
      <button class="btn" type="button" id="clear" hidden>Clear filters</button>
      <button class="btn primary" type="button" id="add-btn" hidden>Add Product</button>
    </form>
    <div id="msg" role="status" aria-live="polite"></div>
    <div class="table-wrap products">
      <table>
        <caption class="visually-hidden">Products</caption>
        <thead>
          <tr>
            <th scope="col" aria-sort="none"><button type="button" class="sort" data-sort="code">Code</button></th>
            <th scope="col" aria-sort="ascending"><button type="button" class="sort" data-sort="description">Description</button></th>
            <th scope="col" aria-sort="none"><button type="button" class="sort" data-sort="unit">Unit</button></th>
            <th scope="col" aria-sort="none" class="num"><button type="button" class="sort" data-sort="price">Current price</button></th>
            <th scope="col" id="actions-th" hidden>Actions</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="4" class="muted">Loading...</td></tr></tbody>
      </table>
    </div>
    <div class="pager" id="pager">
      <span id="count" class="muted" aria-live="polite"></span>
      <span class="pager-btns">
        <label class="visually-hidden" for="pageSize">Rows per page</label>
        <select id="pageSize" style="width:auto">
          <option value="10">10 per page</option><option value="25" selected>25 per page</option>
          <option value="50">50 per page</option><option value="100">100 per page</option>
        </select>
        <button class="btn" type="button" id="prev">Previous</button>
        <span id="pageinfo" class="muted"></span>
        <button class="btn" type="button" id="next">Next</button>
      </span>
    </div>
  </main>
  <dialog id="product-dialog" aria-labelledby="product-title">
    <form id="product-form" method="dialog" novalidate>
      <div class="head"><h2 id="product-title">Add Product</h2><button type="button" class="close" id="product-close" aria-label="Close">&times;</button></div>
      <hr />
      <label for="code">Product code <span class="req">(required)</span></label>
      <input id="code" name="code" maxlength="6" autocomplete="off" required aria-describedby="code-hint" style="text-transform:uppercase" />
      <div class="hint" id="code-hint">Two letters and four digits, for example AD0001. It cannot be changed later.</div>
      <div class="err" data-for="code"></div>
      <label for="description">Description <span class="req">(required)</span></label>
      <input id="description" name="description" maxlength="30" required />
      <div class="err" data-for="description"></div>
      <label for="form-unit">Unit <span class="req">(required)</span></label>
      <select id="form-unit" name="unit" required>
        <option value="">Choose a unit</option>
        <option value="pc">pc (piece)</option>
        <option value="ea">ea (each)</option>
        <option value="mtr">mtr (meter)</option>
        <option value="pkg">pkg (package)</option>
        <option value="ltr">ltr (liter)</option>
      </select>
      <div class="err" data-for="unit"></div>
      <div class="err" id="form-error" role="alert"></div>
      <div class="buttons">
        <button class="btn" type="button" id="cancel-btn">Cancel</button>
        <button class="btn primary" type="submit" id="save-btn">Save Product</button>
      </div>
    </form>
  </dialog>
  <script src="/js/shell.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>
