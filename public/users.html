<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management - Hope, Inc. ERP</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="top">
    <strong>Hope, Inc. ERP</strong>
    <nav><a href="/home.html">Home</a></nav>
  </header>
  <main class="page">
    <h1>User Management</h1>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search name or email" aria-label="Search users" />
      <button class="btn primary" id="add-btn" type="button">Add User</button>
    </div>
    <div id="msg" role="status" aria-live="polite"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="rows"><tr><td colspan="5" class="muted">Loading...</td></tr></tbody>
      </table>
    </div>
  </main>

  <dialog id="user-dialog">
    <form id="user-form" method="dialog" novalidate>
      <h2 id="dialog-title">Add User</h2>
      <label for="firstName">First name</label>
      <input id="firstName" name="firstName" maxlength="50" required />
      <div class="err" data-for="firstName"></div>
      <label for="lastName">Last name</label>
      <input id="lastName" name="lastName" maxlength="50" required />
      <div class="err" data-for="lastName"></div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" maxlength="254" required />
      <div class="err" data-for="email"></div>
      <div id="role-wrap" hidden>
        <label for="role">Role</label>
        <select id="role" name="role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
          <option value="superadmin">Superadmin</option>
        </select>
        <div class="err" data-for="role"></div>
      </div>
      <p class="muted" id="invite-note" style="font-size:.85rem">The person receives an email link to set their own password.</p>
      <div class="err" id="form-error"></div>
      <div class="buttons">
        <button class="btn" type="button" id="cancel-btn">Cancel</button>
        <button class="btn primary" type="submit" id="save-btn">Save</button>
      </div>
    </form>
  </dialog>
  <script src="/js/users.js"></script>
</body>
</html>
